package:
  name: loadskernel
  version: "2026.05"

source:
  url: https://github.com/DLR-AE/LoadsKernel/archive/refs/tags/2026.05.tar.gz
  sha256: e451a021e2519c616a7aca7354a06d5a0c668140b97abaa0795ebbc644619579
  # generated with curl -sL <url/to/*.tar.gz> | openssl sha256
  
build:
  entry_points:
    - loads-kernel=loadskernel.program_flow:command_line_interface
    - model-viewer=modelviewer.view:command_line_interface
    - loads-compare=loadscompare.compare:command_line_interface
    - response-viewer=responseviewer.view:command_line_interface
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.12,<3.14
    - pip
    - setuptools
  run:
    - python >=3.12,<3.14
    - panelaero
    - matplotlib-base
    - numpy >2.0,<2.4.0
    - scipy
    - h5py
    - pytables
    - pyyaml
    - pandas

test:
  imports:
    - loadscompare
    - loadskernel
    - modelviewer
  commands:
    - pip check
    - loads-kernel --help
  requires:
    - pip

outputs:
  - name: loadskernel

  - name: loadskernel-extras
    requirements:
      host:
        - python >=3.12,<3.14
      run:
        - python >=3.12,<3.14
        - mpi4py
        - mayavi
        - traits
        - traitsui
        - pyside6
        - jupyter
        - pyfmi
        - {{ pin_subpackage('loadskernel') }}
    test:
      imports:
        - loadskernel

about:
  home: https://github.com/DLR-AE/LoadsKernel
  summary: The Loads Kernel Software allows for the calculation of aircraft loads.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ArneVoss
